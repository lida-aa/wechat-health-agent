<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyDemo Agent · 会话控制台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --primary: #0D9B6B;
      --primary-light: rgba(13,155,107,0.10);
      --primary-hover: #059669;
      --secondary: #0D9488;
      --secondary-light: rgba(13,148,136,0.10);
      --accent: #B45309;
      --danger: #DC2626;
      --danger-light: rgba(220,38,38,0.10);
      --bg-page: #F5F6F1;
      --bg-card: rgba(255,255,255,0.72);
      --bg-elevated: rgba(255,255,255,0.92);
      --text-main: #1A2720;
      --text-secondary: #5B6B60;
      --text-muted: #97A39A;
      --border: rgba(26,39,32,0.10);
      --shadow-sm: 0 1px 2px rgba(26,39,32,0.05);
      --shadow-md: 0 10px 30px rgba(26,39,32,0.08);
      --shadow-lg: 0 20px 60px rgba(26,39,32,0.14);
      --radius-xs: 4px;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg-page);
      background-image:
        radial-gradient(1200px 700px at 75% -10%, rgba(45,212,191,0.10), transparent 60%),
        radial-gradient(900px 600px at -10% 110%, rgba(16,185,129,0.08), transparent 55%);
      color: var(--text-main); font-size: 14px; line-height: 1.6;
      -webkit-font-smoothing: antialiased; letter-spacing: -0.01em;
    }

    ::selection { background: rgba(16,185,129,0.22); color: var(--text-main); }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(26,39,32,0.14); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(26,39,32,0.24); }

    .brand-serif { font-family: 'Playfair Display', 'Songti SC', serif; font-style: italic; font-weight: 600; letter-spacing: -0.01em; }

    .ambient { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .ambient .orb { position: absolute; border-radius: 50%; filter: blur(110px); will-change: transform; }
    .ambient .orb-1 { width: 560px; height: 560px; top: -180px; left: -140px; background: radial-gradient(circle, rgba(16,185,129,0.14), transparent 68%); animation: orbDrift 26s ease-in-out infinite alternate; }
    .ambient .orb-2 { width: 520px; height: 520px; bottom: -200px; right: -120px; background: radial-gradient(circle, rgba(45,212,191,0.12), transparent 68%); animation: orbDrift 34s ease-in-out infinite alternate-reverse; }
    .ambient .orb-3 { width: 400px; height: 400px; top: 36%; left: 52%; background: radial-gradient(circle, rgba(74,222,128,0.08), transparent 70%); animation: orbDrift 30s ease-in-out infinite alternate; }
    .ambient::after { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(26,39,32,0.028) 1px, transparent 1px), linear-gradient(90deg, rgba(26,39,32,0.028) 1px, transparent 1px); background-size: 60px 60px; -webkit-mask-image: radial-gradient(ellipse at center, black 25%, transparent 78%); mask-image: radial-gradient(ellipse at center, black 25%, transparent 78%); }

    .login-overlay { position: fixed; inset: 0; background: rgba(240,243,237,0.80); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); display: flex; align-items: center; justify-content: center; z-index: 999; }
    .login-card { background: rgba(255,255,255,0.94); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 44px 38px; width: 400px; animation: fadeUp 0.5s var(--ease-spring) both; }
    .login-logo { width: 46px; height: 46px; margin: 0 auto 18px; border-radius: 14px; background: linear-gradient(135deg, #10B981, #059669); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; color: #fff; box-shadow: 0 8px 24px rgba(5,150,105,0.30), inset 0 1px 0 rgba(255,255,255,0.35); }
    .login-card h2 { font-size: 22px; font-weight: 800; color: var(--text-main); text-align: center; margin-bottom: 28px; letter-spacing: -0.02em; }
    .login-card input { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; margin-bottom: 14px; outline: none; background: rgba(26,39,32,0.035); color: var(--text-main); transition: all 0.25s var(--ease-spring); }
    .login-card input::placeholder { color: var(--text-muted); }
    .login-card input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(13,155,107,0.12), 0 0 24px rgba(13,155,107,0.08); background: rgba(255,255,255,0.9); }

    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; border: none; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.25s var(--ease-spring); outline: none; }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: linear-gradient(135deg, #10B981, #059669); color: #fff; font-weight: 700; box-shadow: 0 6px 20px rgba(5,150,105,0.28), inset 0 1px 0 rgba(255,255,255,0.3); }
    .btn-primary:hover { background: linear-gradient(135deg, #34D399, #10B981); transform: translateY(-1px); box-shadow: 0 10px 28px rgba(5,150,105,0.34), inset 0 1px 0 rgba(255,255,255,0.3); }
    .btn-outline { background: rgba(26,39,32,0.03); color: var(--text-secondary); border: 1px solid var(--border); }
    .btn-outline:hover { background: rgba(13,155,107,0.08); border-color: var(--primary); color: var(--primary); }
    .btn-danger-outline { background: rgba(26,39,32,0.02); color: var(--danger); border: 1px solid rgba(220,38,38,0.30); }
    .btn-danger-outline:hover { background: var(--danger-light); }
    .btn-full { width: 100%; justify-content: center; padding: 12px; }

    .layout { display:flex;height:100vh;position:relative;z-index:1; }

    .sidebar { width:280px;background:rgba(255,255,255,0.72);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0; }
    .sidebar-header { padding:24px 20px 16px;border-bottom:1px solid var(--border); }
    .sidebar-header h2 { font-size:16px;font-weight:800;color:var(--text-main);margin-bottom:14px;letter-spacing:-0.02em;display:flex;align-items:center;gap:10px; }
    .mini-logo { width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#10B981,#059669);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0;box-shadow:0 4px 12px rgba(5,150,105,0.28); }
    .sidebar-search { width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:10px;font-size:13px;outline:none;background:rgba(26,39,32,0.035);color:var(--text-main);transition:all 0.25s var(--ease-spring); }
    .sidebar-search::placeholder { color:var(--text-muted); }
    .sidebar-search:focus { border-color:var(--primary);box-shadow:0 0 0 4px rgba(13,155,107,0.12);background:rgba(255,255,255,0.9); }
    .sidebar-list { flex:1;overflow-y:auto;padding:12px; }
    .user-card { display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;cursor:pointer;margin-bottom:4px;position:relative;transition:all 0.25s var(--ease-spring);border:1px solid transparent;border-left:3px solid transparent;animation:fadeUp 0.5s var(--ease-spring) both; }
    .user-card:nth-child(1) { animation-delay:0.04s; }
    .user-card:nth-child(2) { animation-delay:0.08s; }
    .user-card:nth-child(3) { animation-delay:0.12s; }
    .user-card:nth-child(4) { animation-delay:0.16s; }
    .user-card:nth-child(5) { animation-delay:0.2s; }
    .user-card:nth-child(6) { animation-delay:0.24s; }
    .user-card:hover { background:rgba(74,222,128,0.07);border-color:rgba(74,222,128,0.18); }
    .user-card.selected { background:rgba(74,222,128,0.10);border-left-color:var(--primary);border-color:rgba(74,222,128,0.22); }
    .session-avatar { width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;flex-shrink:0;background:linear-gradient(135deg,rgba(52,211,153,0.22),rgba(16,185,129,0.15));color:var(--primary);border:1px solid rgba(52,211,153,0.25);transition:all 0.25s var(--ease-spring); }
    .user-card.selected .session-avatar { background:linear-gradient(135deg,#34D399,#10B981);color:#04230F;border-color:transparent;box-shadow:0 4px 14px rgba(16,185,129,0.35); }
    .session-main { flex:1;min-width:0; }
    .session-top { display:flex;align-items:center;justify-content:space-between;gap:8px; }
    .user-card .user-name { font-size:13.5px;font-weight:600;color:var(--text-main);white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .user-card.selected .user-name { color:var(--primary); }
    .user-card .user-preview { font-size:12px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px; }
    .user-card .user-time { font-size:11px;color:var(--text-muted);flex-shrink:0; }
    .sidebar-footer { padding:14px 20px;border-top:1px solid var(--border);font-size:12px;color:var(--text-muted);text-align:center;background:rgba(26,39,32,0.02);display:flex;align-items:center;justify-content:center;gap:8px; }
    .sidebar-footer .count { font-weight:700;color:var(--primary);font-size:14px; }
    .main-panel { flex:1;display:flex;flex-direction:column;min-width:0;position:relative; }
    .main-panel-inner { flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden; }
    .main-panel-inner:not(.chat-active) { flex:none; }
    .panel-topbar { background:rgba(255,255,255,0.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding:18px 28px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:1px solid var(--border); }
    .panel-topbar .user-title { font-size:16px;font-weight:700;color:var(--text-main);cursor:pointer;transition:color 0.2s; }
    .panel-topbar .user-title:hover { color:var(--primary); }
    .topbar-actions { display:flex;gap:8px; }
    .tab-bar { display:flex;gap:4px;padding:4px;margin:14px 24px 0;background:rgba(26,39,32,0.03);border:1px solid var(--border);border-radius:12px;width:max-content;flex-shrink:0; }
    .tab-item { padding:8px 18px;font-size:13px;font-weight:600;border-radius:9px;cursor:pointer;transition:all 0.25s var(--ease-spring);color:var(--text-secondary);border:none;animation:fadeUp 0.5s var(--ease-spring) both; }
    .tab-item:hover { color:var(--primary);background:rgba(13,155,107,0.08); }
    .tab-item.active { color:#fff;background:linear-gradient(135deg,#10B981,#059669);font-weight:700;box-shadow:0 4px 14px rgba(5,150,105,0.30); }
    .panel-content { flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;padding:20px 24px 24px;background:transparent; }
    .content-card { flex:1;min-height:0;overflow-y:auto;background:rgba(255,255,255,0.72);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;transition:border-color 0.3s,box-shadow 0.3s;animation:fadeUp 0.6s var(--ease-spring) both; }
    .content-card:hover { border-color:rgba(13,155,107,0.22);box-shadow:0 12px 40px rgba(26,39,32,0.08); }
    .empty-state { flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--text-muted); }
    .empty-icon { width:72px;height:72px;border-radius:50%;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:4px;box-shadow:0 0 40px rgba(74,222,128,0.12); }
    .empty-text { font-size:15px;font-weight:500;color:var(--text-secondary); }
    .empty-hint { font-size:13px;color:var(--text-muted); }
    .chat-row { display:flex;gap:10px;align-items:flex-end;animation:fadeUp 0.4s var(--ease-spring) both; }
    .chat-row.user { flex-direction:row-reverse; }
    .msg-avatar { width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0; }
    .msg-avatar.assistant { background:linear-gradient(135deg,#10B981,#059669);color:#fff;box-shadow:0 4px 12px rgba(5,150,105,0.30);font-family:'Playfair Display',serif;font-style:italic;font-size:15px; }
    .msg-avatar.user { background:rgba(26,39,32,0.05);color:var(--text-secondary);border:1px solid var(--border); }
    .msg-wrap { display:flex;flex-direction:column;max-width:74%;min-width:0; }
    .chat-row.user .msg-wrap { align-items:flex-end; }
    .msg-bubble { padding:12px 16px;border-radius:16px;line-height:1.7;word-break:break-word;font-size:14px; }
    .msg-bubble.user { background:linear-gradient(135deg,rgba(16,185,129,0.12),rgba(13,155,107,0.08));border:1px solid rgba(13,155,107,0.26);border-bottom-right-radius:6px; }
    .msg-bubble.assistant { background:rgba(255,255,255,0.85);border:1px solid var(--border);border-bottom-left-radius:6px; }
    .msg-time { font-size:11px;color:var(--text-muted);margin-top:5px; }
    .chat-row.user .msg-time { text-align:right;color:rgba(26,39,32,0.45); }
    .msg-bubble p { margin:4px 0; }
    .msg-bubble table { border-collapse:collapse;font-size:13px;width:100%; }
    .msg-bubble td,.msg-bubble th { border:1px solid var(--border);padding:6px 10px; }
    .msg-bubble th { background:rgba(26,39,32,0.04);font-weight:600; }
    .msg-bubble code { background:rgba(13,155,107,0.10);padding:2px 6px;border-radius:4px;font-size:12px;color:#047857;font-family:'JetBrains Mono',monospace; }
    .msg-bubble pre { background:rgba(23,35,28,0.96);padding:12px;border-radius:10px;overflow-x:auto;font-size:12px;border:1px solid rgba(26,39,32,0.12);font-family:'JetBrains Mono',monospace;color:#BDE3C8; }
    .msg-bubble img { max-width:100%;border-radius:10px; }
    .msg-img { max-width:200px;border-radius:10px;cursor:pointer;display:block;transition:transform 0.25s var(--ease-spring); }
    .msg-img:hover { transform:scale(1.03); }
    .image-grid { display:grid;grid-template-columns:repeat(4,1fr);gap:16px; }
    .image-card { background:rgba(255,255,255,0.85);border-radius:14px;overflow:hidden;cursor:pointer;transition:all 0.3s var(--ease-spring);border:1px solid var(--border);position:relative; }
    .image-card:hover { transform:translateY(-3px);border-color:rgba(13,155,107,0.3);box-shadow:0 12px 32px rgba(26,39,32,0.10); }
    .image-card img { width:100%;height:140px;object-fit:cover;display:block; }
    .image-card .img-desc { padding:8px 12px;font-size:12px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .img-cb-wrap { position:absolute;top:6px;left:6px;z-index:2; }
    .file-list { display:flex;flex-direction:column;gap:8px; }
    .file-item { display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-radius:12px;cursor:pointer;transition:all 0.25s var(--ease-spring);border:1px solid var(--border);background:rgba(26,39,32,0.02); }
    .file-item:hover { background:rgba(13,155,107,0.06);border-color:rgba(13,155,107,0.28); }
    .file-item .file-info { flex:1;min-width:0; }
    .file-item .file-name { font-size:14px;font-weight:600;color:var(--primary);margin-bottom:2px; }
    .file-item .file-preview { font-size:12px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .file-item .file-time { font-size:12px;color:var(--text-muted);white-space:nowrap;margin-left:16px; }
    .preview-overlay { position:fixed;inset:0;background:rgba(238,242,236,0.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:center;z-index:999; }
    .preview-overlay img { max-width:90vw;max-height:90vh;border-radius:var(--radius-md);box-shadow:var(--shadow-lg); }
    .preview-modal { background:rgba(255,255,255,0.97);border:1px solid var(--border);border-radius:var(--radius-lg);max-width:800px;width:90%;max-height:85vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg); }
    .preview-modal .modal-header { display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border); }
    .preview-modal .modal-header h3 { font-size:16px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
    .preview-modal .modal-close { font-size:22px;color:var(--text-muted);cursor:pointer;background:none;border:none;padding:4px;transition:color 0.2s; }
    .preview-modal .modal-close:hover { color:var(--danger); }
    .preview-modal .modal-body { flex:1;overflow-y:auto;padding:20px 24px; }
    .preview-modal .modal-body pre { font-size:13px;white-space:pre-wrap;font-family:'JetBrains Mono','Fira Code',monospace;line-height:1.6;color:var(--text-secondary); }
    .preview-modal .modal-body iframe { width:100%;height:500px;border:none; }
    .modal-link { font-size:13px;color:var(--primary);text-decoration:none;margin-right:12px; }
    .modal-link:hover { text-decoration:underline; }

    .batch-bar { display:flex;align-items:center;gap:12px;padding:8px 12px;margin-bottom:12px;background:rgba(26,39,32,0.03);border-radius:10px;border:1px solid var(--border);min-height:40px; }
    .batch-bar .batch-count { font-size:13px;color:var(--text-secondary);flex:1; }
    .batch-bar .batch-count strong { color:var(--primary); }
    .cb { width:18px;height:18px;border:1.5px solid var(--border);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.2s var(--ease-spring);flex-shrink:0;background:rgba(26,39,32,0.03);color:transparent;font-size:12px;font-weight:700; }
    .cb.checked { background:linear-gradient(135deg,#10B981,#059669);border-color:transparent;color:#fff;box-shadow:0 2px 10px rgba(5,150,105,0.30); }
    .cb:hover { border-color:var(--primary); }

    .drop-zone { border:1.5px dashed rgba(26,39,32,0.16);border-radius:var(--radius-lg);padding:56px 32px;text-align:center;cursor:pointer;transition:all 0.3s var(--ease-spring);background:rgba(26,39,32,0.015); }
    .drop-zone:hover { border-color:var(--primary);background:rgba(13,155,107,0.05);box-shadow:inset 0 0 60px rgba(13,155,107,0.04); }
    .drop-icon { font-size:52px;margin-bottom:12px;color:var(--text-secondary); }
    .drop-title { font-size:17px;font-weight:700;color:var(--text-main);margin-bottom:6px;letter-spacing:-0.01em; }
    .drop-hint { font-size:11px;color:var(--text-muted); }
    .drop-loading { margin-top:8px;font-size:12px;color:var(--primary);font-weight:600; }
    .kb-stats { display:flex;gap:16px;margin-top:16px; }
    .kb-stat { flex:1;text-align:center;padding:12px;background:rgba(26,39,32,0.02);border-radius:10px;border:1px solid var(--border); }
    .kb-stat-num { display:block;font-size:24px;font-weight:700;color:var(--primary);font-variant-numeric:tabular-nums; }
    .kb-stat span:last-child { font-size:12px;color:var(--text-secondary); }

    .console-wrap { position:relative;z-index:1; }
    .console { max-width:1200px;margin:0 auto; }
    .console-header { display:flex;justify-content:space-between;align-items:center;padding:48px 0 28px; }
    .console-brand { display:flex;align-items:center;gap:16px; }
    .console-header h1 { font-size:30px;font-weight:800;color:var(--text-main);letter-spacing:-0.03em;line-height:1.15; }
    .console-hint { font-size:13px;color:var(--text-muted);margin-top:6px; }
    .console-stats { display:flex;gap:20px;margin-bottom:36px; }
    .console-stat { flex:1;background:rgba(255,255,255,0.72);border:1px solid var(--border);border-radius:var(--radius-lg);padding:26px 28px;display:flex;align-items:center;gap:16px;cursor:default;transition:all 0.3s var(--ease-spring);animation:fadeUp 0.6s var(--ease-spring) both; }
    .console-stat:nth-child(2) { animation-delay:0.08s; }
    .console-stat:hover { transform:translateY(-3px);border-color:rgba(13,155,107,0.28);box-shadow:0 12px 36px rgba(26,39,32,0.09); }
    .console-stat-icon { width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;box-shadow:0 0 30px rgba(74,222,128,0.12); }
    .console-stat-val { font-size:32px;font-weight:800;color:var(--text-main);line-height:1.2;letter-spacing:-0.02em;font-variant-numeric:tabular-nums; }
    .console-stat-label { font-size:13px;color:var(--text-muted); }
    .console-section-title { font-size:19px;font-weight:800;color:var(--text-main);margin-bottom:20px;letter-spacing:-0.02em; }
